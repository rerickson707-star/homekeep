<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Steadwell — Home Maintenance Tracking & Asset Management</title>

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Steadwell",
      "url": "https://www.trysteadwell.app",
      "description": "Steadwell helps homeowners track maintenance, manage appliances, and stay ahead of costly repairs. Scan appliance nameplates with AI, set seasonal reminders, and keep your home records organized.",
      "applicationCategory": "HomeAndGarden",
      "operatingSystem": "Web, iOS, Android",
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "USD"
        },
        {
          "@type": "Offer",
          "name": "Plus",
          "price": "4.99",
          "priceCurrency": "USD",
          "billingIncrement": "P1M"
        },
        {
          "@type": "Offer",
          "name": "Pro",
          "price": "9.99",
          "priceCurrency": "USD",
          "billingIncrement": "P1M"
        }
      ],
      "publisher": {
        "@type": "Organization",
        "name": "Steadwell",
        "url": "https://www.trysteadwell.app"
      },
      "featureList": [
        "AI appliance nameplate scanning",
        "Home maintenance reminders",
        "Asset and appliance tracking",
        "Expense and repair logging",
        "Shared home access for families",
        "Document and warranty storage"
      ]
    }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

        "@type": "ContactPoint",
        "contactType": "customer support",

      },
      "sameAs": []
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
